# Замените default.conf на это содержимое ПОСЛЕ успешного выпуска сертификата и
# подключения ssl.conf + тома /etc/letsencrypt. Редирект HTTP→HTTPS, ACME для продления.

server {
    listen 80;
    server_name days100.ru www.days100.ru;

    location /.well-known/acme-challenge/ {
        alias /var/www/certbot/.well-known/acme-challenge/;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
