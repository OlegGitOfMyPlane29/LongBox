# Подключается отдельным volume в docker-compose.ssl.yml после появления файлов в
# /etc/letsencrypt/live/days100.ru/ (certbot на хосте).

server {
    listen 443 ssl;
    http2 on;
    server_name days100.ru www.days100.ru;

    ssl_certificate /etc/letsencrypt/live/days100.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/days100.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

    location /api/ {
        proxy_pass http://api:8080/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
